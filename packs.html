<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a1420">
  <meta name="description" content="The Top Wallhops — Wallhop Packs">
  <title>TTWL</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./site-additions.css">
  <link rel="stylesheet" href="./packs.css">
  <script defer src="./config.js"></script>
  <script defer src="./site-additions.js"></script>
  <script defer src="./packs.js"></script>
</head>
<body class="ttwl-packs-page">
  <header class="site-header">
    <div class="site-header-inner shell">
      <a class="brand" href="./index.html#pc">The Top Wallhops</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-item" href="./index.html#pc">PC Wallhops</a>
        <a class="nav-item" href="./index.html#mobile">Mobile Wallhops</a>
        <a class="nav-item" href="./index.html#legacy">Legacy List</a>
        <a class="nav-item is-active ttwl-packs-link" href="./packs.html" aria-current="page">Packs</a>
        <a class="nav-item" href="./leaderboard.html">Leaderboard</a>
        <a class="nav-item" href="./rules.html">Rules</a>
      </nav>
    </div>
  </header>
  <main class="shell page packs-page">
    <div class="page-intro"><h1>Wallhop Packs</h1><p class="packs-caption">Complete a pack by finishing its wallhops.</p></div>
    <div id="packsAlert" class="packs-alert" role="status" hidden></div>
    <div class="content-grid packs-layout">
      <section class="rankings-column packs-main" aria-label="Wallhop pack list">
        <div class="toolbar packs-toolbar"><label class="search-field toolbar-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.3 16.3 5 5"/></svg>
          <input type="search" id="packSearch" placeholder="Search packs..." aria-label="Search packs" autocomplete="off">
        </label></div>
        <div class="packs-list" id="packsList"><p class="packs-placeholder">Loading Wallhop Packs...</p></div>
        <div class="table-bottom packs-bottom"><span id="packResults">Loading...</span></div>
      </section>
      <aside class="details-column packs-side" aria-label="Selected pack details">
        <section class="detail-panel packs-detail-panel" id="packDetails">
          <div class="detail-heading"><h2 id="packTitle">Select a pack</h2></div>
          <div class="packs-detail-stats">
            <div><span>Difficulty</span><strong id="packDifficulty">—</strong></div>
            <div><span>Points</span><strong id="packPoints">—</strong></div>
            <div><span>Wallhops</span><strong id="packCount">—</strong></div>
          </div>
          <h3 class="packs-members-heading">Wallhops in this pack</h3>
          <ul class="packs-members" id="packMembers"><li>Choose a pack to see its wallhops.</li></ul>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
